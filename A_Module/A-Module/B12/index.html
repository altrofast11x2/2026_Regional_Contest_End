<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../lib/lib.js"></script>
  <title>document</title>
</head>
<style>
#img{display:block; width:100%; max-width:600px; height:360px; margin:0 auto; border:1px solid #ccc; border-radius:10px; object-fit:contain; background:#fff; transition:filter 0.3s; }
#btns{margin-top:20px; display:flex; justify-content: center; gap: 12px;}
#btns button{border: 1px solid #333;}
</style>
<body>
  <input type="file" id="f" accept="image/*" />
  <img id="img" />
  <div id="btns">
    <button data-filter="grayscale(100%)">흑백</button>
    <button data-filter="sepia(100%)">세피아</button>
    <button data-filter="invert(100%)">반전</button>
    <button data-filter="none">원본</button>
    <script src="../lib.js"></script>
    <script src="./script.js"></script>
  </div>
  
</body>

</html>
