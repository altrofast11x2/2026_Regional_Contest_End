<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../reset.css">
</head>
<style>
  .container {
    width: 900px;
    height: 850px;
    box-shadow: 0px 0px 4px 0.3px #33333350;
    border-radius: 16px;
  }

  section {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background-color: #e6e6e6;
  }

  .t_head {
    text-align: center;
    width: 100%;
    height: 100px;
    line-height: 100px;
    background-color: #333;
    font-size: 2.1em;
    font-weight: bold;
    color: #fff;
    border-radius: 16px 16px 0 0;
  }

  .t_tr {
    width: 100%;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #33333350;

  }

  img {
    width: 125px;
    height: 125px;
    border-radius: 12px;
    margin-right: 20px;
  }

  .wrap,
  .wrap2 {
    margin: 0 25px;
    display: flex;
  }

  .wrap>ul>li {
    font-size: 1.1em;
    margin: 15px 0;
    color: #686868;
  }

  .wrap2 {
    font-weight: bold;
    width: 250px;
    align-items: center;
    justify-content: space-between;
  }

  .stock {
    width: 100px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .stock button {
    width: 25px;
    height: 25px;
    line-height: 25px;
    text-align: center;
    border: 1px solid #666;
  }

  .del {
    width: 25px;
    height: 25px;
    line-height: 25px;
    text-align: center;
    background-color: rgb(255, 42, 42);
    border-radius: 50%;
    color: #fff;
  }

  .cart_foot {
    height: 100px;
    padding: 0 20px;
    background-color: #dadada;

    display: flex;
  }

  .con {
    width: 100%;
    height: 100%;
    margin: 0 25px;
    padding: 20px 0;
    border-bottom: 1px solid #33333350;
    display: flex;
    justify-content: space-between;
  }

  .con>ul>li {
    margin: 5px 0;
  }

  .price {
    text-align: end;
  }

  .total {
    display: flex;
    justify-content: space-between;
    margin: 0 45px;
    padding: 20px 0;
    font-weight: bold;
    font-size: 1.5em;
  }

  .buy>* {
    text-align: center;
    line-height: 50px;
    width: 150px;
    height: 50px;
    font-size: 1em;
    color: #fff;
    font-weight: bold;
    border-radius: 6px;
  }
  .buy>a{
    background-color: #483f70;
  }
  .buy>button{
    line-height: 53px;
    background-color: rgb(17, 143, 17);
  }

  .buy {
    margin: 0 auto;
    width: 320px;
    display: flex;
    justify-content: space-between;
  }
</style>

<body>
  <section>
    <div class="container">
      <div class="t_head">장바구니</div>
      <div class="t_body">
        <div class="t_tr">
          <div class="wrap">
            <a href="#"><img src="./images/tshirt.jpg" alt="./images/tshirt.jpg"></a>
            <ul>
              <h2>WorldSkills 공식 티셔츠</h2>
              <li>색상: 네이비</li>
              <li>사이즈: L</li>
            </ul>
          </div>
          <div class="wrap2">
            <div class="stock">
              <button>-</button>
              <p class="num">2</p>
              <button>+</button>
            </div>
            <div class="price">25,000원</div>
            <div class="del">×</div>
          </div>
        </div>
        <div class="t_tr">
          <div class="wrap">
            <a href="#"><img src="./images/book.jpg" alt="./images/book.jpg"></a>
            <ul>
              <h2>기능경기 가이드북</h2>
              <li>종류: 웹디자인</li>
              <li>2026년 최신판</li>
            </ul>
          </div>
          <div class="wrap2">
            <div class="stock">
              <button>-</button>
              <p class="num">2</p>
              <button>+</button>
            </div>
            <div class="price">25,000원</div>
            <div class="del">×</div>
          </div>
        </div>
        <div class="t_tr">
          <div class="wrap">
            <a href="#"><img src="./images/laptop-case.jpg" alt="./images/laptop-case.jpg"></a>
            <ul>
              <h2>WorldSkills 노트북 파우치</h2>
              <li>색상: 블랙</li>
              <li>15인치 호환</li>
            </ul>
          </div>
          <div class="wrap2">
            <div class="stock">
              <button>-</button>
              <p class="num">2</p>
              <button>+</button>
            </div>
            <div class="price">25,000원</div>
            <div class="del">×</div>
          </div>
        </div>
      </div>
      <div class="cart_foot">
        <div class="con">
          <ul class="ment">
            <li>상품금액</li>
            <li>배송비</li>
          </ul>
          <ul class="price">
            <li>75,000원</li>
            <li>3,000원</li>
          </ul>
        </div>
      </div>
      <ul class="total">
        <li>총 결제금액</li>
        <li> 78,000원</li>
      </ul>
      <div class="buy">
        <a href="#">쇼핑 계속하기</a>
        <button>주문하기</button>
      </div>
    </div>
  </section>
</body>

</html>
