<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../reset.css">
</head>
<style>
  input[type="checkbox"]{display: none;}
  .toggle_btn{display: flex; align-items: center; padding: 0 5px; width: 100px;height: 35px;border-radius: 25px; border: 1px solid #333; cursor: pointer;}
  .toggle_btn::before{content: '';width: 25px;height: 25px;background-color: #dbdbdb; border-radius: 50%;transition: .3s;}
  .wrap{width: 100%;height: 100vh;background-color: #fff;}
  #toggle:checked ~ .wrap{background-color: #222;transition: .3s;}
  #toggle:checked ~ .wrap .toggle_btn::before{margin-left: 65px;background-color: yellow;}
  #toggle:checked ~ .wrap .toggle_btn{transition: .3s; background-color: rgb(1, 1, 82);}
</style>
<body>
  <input type="checkbox" name="toggle" id="toggle">
  <div class="wrap">
    <label for="toggle" class="toggle_btn"></label>
  </div>
</body>

</html>
