<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <label for="pwd">비밀번호</label>
  <input type="password" id="pwd">
</body>
<script src="../lib.js"></script>
<script>
  const input = $('input')
  const getStrength = e => {
    const l = e.length,
      u = /[A-Z]/.test(e),
      n = /[0-9]/.test(e),
      s = /[!@#$%^&*]/.test(e)
    input.style.borderColor =
      !l ? "black" :
        l >= 8 && u && n && s ? "green" :
          l >= 6 && (u || n) ? "orange" : "red"
  }
  input.addEventListener('input', ({ target }) => {
    getStrength(target.value)
  })
</script>

</html>
