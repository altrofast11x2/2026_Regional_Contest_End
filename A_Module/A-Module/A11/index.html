<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  *{margin: 0;padding: 0;box-sizing: border-box;}
  label{display: none;font-size: 42px;}
  header{width: 100%;height: 80px; display: flex;align-items: center; justify-content: center;background-color: rgb(33, 140, 247);}
  nav a{text-decoration: none;font-size: 22px;font-weight: bold;margin: 0 10px;color: #333;}
  @media (max-width:768px) {
    label{position: relative; display: block;}
    nav{position: absolute; display: none;top: 8%;background-color: rgb(33, 140, 247);padding: 10px 0;width: 100%;}
    header{display: flex;flex-direction: column;}
    #menu:checked ~ nav{display: flex;align-items: center;justify-content: center;}
  }
</style>
<body>
  <header>
    <label for="menu" class="ham">&#x2261;</label>
    <input type="checkbox" id="menu" hidden>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>
</body>

</html>
