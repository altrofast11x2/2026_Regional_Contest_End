<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../reset.css">
</head>
<style>
body{display: flex;align-items: center;justify-content: center; height: 100vh;}
.box{width: 400px;height: 400px;background-color: rgb(254, 26, 26);animation: polygon 6s forwards infinite;}
@keyframes polygon {
  0%,100%{clip-path:polygon(0% 100% , 0% 100% , 100% 100% , 100% 100% , 50% 0% , 50% 0%);}
  25%{clip-path:polygon(0% 100% , 0% 100% , 100% 100% , 100% 100% , 100% 0% , 0% 0%);}
  50%{clip-path:polygon(0% 50% , 20% 100% , 80% 100% , 100% 50% , 50% 0% , 50% 0%);}
  75%{clip-path:polygon(0% 50% , 25% 100% , 80% 100% , 100% 50% , 80% 0% , 25% 0%);}
}
</style>
<body>
  <div class="box"></div>
</body>
</html>
