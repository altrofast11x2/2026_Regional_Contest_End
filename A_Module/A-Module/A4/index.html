<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../reset.css">
</head>
<style>
section{width: 100%;height: 100vh;display: flex;justify-content: center;align-items: center;flex-direction: column;color: #333;}
.title{font-size: 2.1em;margin-bottom: 20px;}
article{width: 550px;height: 700px;box-shadow: 0px 0px 4px 0.3px #33333370; padding: 40px; border-radius: 12px;}
span{color: red;}
article form{display: flex;justify-content: center;flex-direction: column; }
article form h3{margin: 20px 0;}
input{border: 1px solid #333; padding:20px; font-size: 1em;}
button{margin-top: 40px; padding:18px 20px; font-size: 1em;border: 1px solid #333;background-color: rgb(172, 92, 255); color: #fff; font-weight: bold;}
button:hover{color:rgb(172, 92, 255) ;background-color: aliceblue;transition: .2s;}
</style>

<body>
  <!-- 대충해도 됨. -->
  <section>
    <h2 class="title">회원가입</h2>
    <article>
      <form>

        <h3><span> * </span>이름</h3>
        <input type="text" name="auth" id="name" placeholder="이름" required>

        <h3><span> * </span>이메일</h3>
        <input type="email" name="auth" id="email" placeholder="이메일" required>

        <h3><span> * </span>비밀번호</h3>
        <input type="password" name="auth" id="password" placeholder="비밀번호" required>

        <h3><span> * </span>비밀번호 확인</h3>
        <input type="password" name="auth" id="password_check" placeholder="비밀번호 확인" required>

        <button type="submit">회원가입</button>
      </form>
    </article>
  </section>
</body>

</html>
