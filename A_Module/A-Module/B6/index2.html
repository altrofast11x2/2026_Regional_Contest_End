<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .container {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .dragitem {
    display: grid;
    grid-template-columns: repeat(3, 2fr);
  }

  .dropzone {
    width: 600px;
    height: 400px;
    text-align: center;
    line-height: 400px;
    border: 1px solid #000;
  }
</style>

<body>
  <div class="container">
    <div class="itemzone">
      <ul class="dragitem">
        <li><img src="./test-images/test1.gif"></li>
        <li><img src="./test-images/test1.jpg"></li>
        <li><img src="./test-images/test1.png"></li>
        <li><img src="./test-images/test2.gif"></li>
        <li><img src="./test-images/test2.jpg"></li>
        <li><img src="./test-images/test2.png"></li>
      </ul>
    </div>
    <div class="dropzone">
      <p>여기에 드래그하세요.</p>
    </div>
  </div>
</body>
<script src="../lib.js"></script>
<script>
  const di = $$(".dragitem > li")
  const dz = $(".dropzone")
  di.forEach(e => {
    e.ondragstart = el =>
      el.dataTransfer.setData("html", e.innerHTML)
  });
  dz.ondragover = (e) => e.preventDefault()
  dz.ondrop = (e) => {
    $('p')?.remove()
    dz.innerHTML += e.dataTransfer.getData("html")
  }
</script>

</html>
